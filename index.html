<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ကျွန်တော့် AI အကူ - မြန်မာစာ</title>
    <meta name="description" content="မြန်မာစာပါ AI အကူ - အခမဲ့ API တွေနဲ့">
    
    <meta name="theme-color" content="#4F46E5">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 ကျွန်တော့် AI အကူ</h1>
            <p>မြန်မာစာပါ • အခမဲ့ API • လုံခြုံရေး</p>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="message ai-message">
                <div class="message-bubble mm-text">
                    မင်္ဂလာပါ! ကျွန်တော်က မြန်မာစာပါ AI အကူပါ။ ရာသီဥတု၊ သတင်း၊ ငွေလဲနှုန်း၊ စာရင်းရှင်းတွက်ခိုင်းတာ စတာတွေ ကူညီပေးနိုင်ပါတယ်။
                </div>
            </div>
        </div>
        
        <div class="input-container">
            <input type="text" id="userInput" placeholder="ရာသီဥတု၊ သတင်း၊ ငွေလဲနှုန်း စတာတွေ မေးမယ်..." autocomplete="off">
            <button id="sendButton">➤</button>
        </div>
    </div>

    <div class="install-prompt" id="installPrompt">
        <span>AI Assistant ကို app အဖြစ်သွင်းမလား?</span>
        <button class="install-btn" id="installButton">သွင်းမယ်</button>
        <button id="cancelInstall">မသွင်းတော့ပါ</button>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
